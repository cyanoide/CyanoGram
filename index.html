<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>CyanoGram</title>
<meta name="description" content="Retouche photo argentique : grain, poussières, bloom, teal & orange.">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CyanoGram">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><img src="icons/favicon.svg" alt="" width="22" height="22"><span>Cyano<b>Gram</b></span></div>
    <div class="actions">
      <button id="btnOpen" class="btn">Photo / vidéo</button>
      <button id="btnCompare" class="btn" disabled>Original</button>
      <button id="btnExport" class="btn primary" disabled>Exporter</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="view"></canvas>
    <div class="empty" id="empty">
      <div class="empty-card">
        <p>Dépose une photo ou une vidéo ici,<br>ou choisis-en une.</p>
        <button id="btnOpen2" class="btn primary big">Choisir une photo / vidéo</button>
        <small>Tout reste sur ton appareil.</small>
      </div>
    </div>
    <div class="vbar" id="vbar" hidden>
      <button class="vplay" id="vPlay" aria-label="Lecture / pause">
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.4"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4"/></svg>
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2z"/></svg>
      </button>
      <input type="range" id="vSeek" min="0" max="1000" value="0" aria-label="Position">
      <span id="vTime">0:00</span>
    </div>
    <div class="hint" id="hint" hidden>Maintiens pour voir l'original</div>
  </main>

  <section class="panel">
    <nav class="tabs" id="tabs"></nav>
    <div class="body" id="body"></div>
  </section>
</div>
<div class="gate" id="gate" hidden>
  <form class="gate-card" id="gateForm" autocomplete="on">
    <img src="icons/icon-192.png" alt="" width="72" height="72">
    <h1>Cyano<b>Gram</b></h1>
    <p>Connecte-toi pour retrouver tes styles sur tous tes appareils.</p>
    <input id="gateEmail" type="text" name="username" placeholder="E-mail ou nom d'utilisateur" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <input id="gatePw" type="password" name="password" placeholder="Mot de passe (6 caractères min.)" autocomplete="current-password" required>
    <input id="gateUser" type="text" placeholder="Nom d'utilisateur (pour créer un compte)" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="24">
    <p class="gate-msg" id="gateMsg"></p>
    <button class="btn primary big" type="submit">Se connecter</button>
    <button class="btn" type="button" id="gateSignup">Créer un compte</button>
    <button class="linkbtn" type="button" id="gateSkip">Continuer sans compte</button>
  </form>
</div>
<input type="file" id="file" accept="image/*,video/*" hidden>
<input type="file" id="fileStyles" accept="application/json,.json" hidden>
<dialog id="exportDlg">
  <h2 id="expDlgTitle">Photo prête</h2>
  <p id="expInfo"></p>
  <p id="expMeta" class="note"></p>
  <div class="dlg-actions">
    <button class="btn primary big" id="expShare">Enregistrer / Partager</button>
    <button class="btn" id="expDl">Télécharger le fichier</button>
    <button class="btn" id="expClose">Fermer</button>
  </div>
</dialog>
<script src="js/vendor/supabase.js"></script>
<script src="js/vendor/mp4-muxer.js"></script>
<script src="js/vendor/mp4box.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
